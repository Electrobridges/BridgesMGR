{% extends "base.html" %}
{% block titulo %}Entrar — BridgesMGR{% endblock %}

{% block contenido %}
{% include "partials/fondo_marca.html" %}

<div class="login-caja">
  <div class="login-cabecera">
    <img class="marca-logo grande" src="/static/imagenes/bridgesmgr-oscuro-transparente.png"
         alt="" width="76" height="76">
    <h1>Bridges<span class="acento">MGR</span></h1>
    <p class="tenue">Administración del servidor OpenVPN</p>
  </div>

  {% if error %}
  <div class="aviso aviso-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" class="formulario">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" required autofocus
           autocomplete="username" maxlength="64">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required
           autocomplete="current-password">

    <button type="submit" class="boton boton-principal">Entrar</button>
  </form>

  {% include "partials/firma.html" %}
</div>
{% endblock %}
