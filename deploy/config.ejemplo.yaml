# OpenVPN Manager Web — configuración
#
# Destino: /etc/ovpn-web/config.yaml   (root:ovpnweb, modo 0640)
#
# Lo leen dos procesos: el panel (usuario ovpnweb) y el helper privilegiado
# (root). El helper solo acepta rutas desde aquí, nunca por argumento; por eso
# este archivo debe pertenecer a root y no ser escribible por ovpnweb.

servidor:
  # IP en la que escucha el panel. Ponla en la IP de la LAN del servidor,
  # nunca en 0.0.0.0 si la máquina tiene una pata en internet.
  host_bind: "192.168.1.192"
  puerto: 55443
  tls_cert: "/etc/ovpn-web/tls/cert.pem"
  tls_key: "/etc/ovpn-web/tls/key.pem"

openvpn:
  # Estas rutas son las que deja deploy/instalar-openvpn.sh. Si tu servidor ya
  # existía, ajústalas a lo que diga tu server.conf.
  log_path: "/var/log/openvpn/openvpn.log"
  # Ojo: el nombre depende de tu server.conf. Si pusiste
  # 'status /var/log/openvpn/status.log', va sin el prefijo 'openvpn-'.
  # Y tiene que ser 'status-version 3': es el único formato que se parsea.
  status_path: "/var/log/openvpn/status.log"
  # 127.0.0.1 explícito: 'localhost' puede resolver a IPv6 y el management
  # de OpenVPN solo escucha en IPv4.
  mgmt_host: "127.0.0.1"
  mgmt_port: 7505
  easyrsa_path: "/etc/openvpn/easy-rsa"
  # Dos nombres de unidad conviven en Debian y no son intercambiables:
  #   openvpn-server@server  lee /etc/openvpn/server/server.conf  (el moderno,
  #                          y el que monta instalar-openvpn.sh)
  #   openvpn@server         lee /etc/openvpn/server.conf          (el antiguo)
  # Comprueba cuál tienes con: systemctl list-units 'openvpn*'
  servicio: "openvpn-server@server"
  # De aquí saca el helper con qué certificado se identifica el servidor, para
  # excluirlo de la lista de clientes: es un certificado más de la misma PKI y
  # si no, el panel lo ofrece como si fuera un cliente, con su botón de revocar.
  # Vacío = prueba /etc/openvpn/server.conf y /etc/openvpn/server/server.conf.
  server_conf: ""
  # Vacío = se deduce del certificado que declare ese archivo, que es lo
  # correcto casi siempre. Decláralo solo si la deducción no sirve en tu
  # instalación; entonces el helper se lo cree y no mira el disco.
  cn_servidor: ""

cliente_ovpn:
  # Dirección por la que los clientes llegan al servidor VPN desde fuera.
  # No es la IP del panel: es la pública o el dominio dinámico.
  remote_host: "vpn.ejemplo.com"
  remote_puerto: 1194
  proto: "udp"
  # El primario que negocia instalar-openvpn.sh, no el de respaldo. Declarar
  # aquí AES-256-CBC dejaba a los perfiles pidiendo un cifrado que el servidor
  # solo acepta como último recurso. Hay prueba de paridad.
  cipher: "AES-256-GCM"
  # Si tu server.conf usa tls-crypt, apunta aquí a la clave para embeberla
  # en los .ovpn. Déjalo vacío si no usas tls-crypt.
  tls_crypt: "/etc/openvpn/tls-crypt.key"

# Avisos de sucesos importantes. Es lo ÚNICO que hace que el panel salga a
# internet: sin esto solo habla con 127.0.0.1, el disco y sudo. Si lo dejas
# vacío, no sale nada y no hay canal de salida que comprometer.
#
# Los destinos van aquí y no en el panel a propósito: este archivo es
# root:ovpnweb 0640, así que el panel lo lee y no lo escribe. Quien lo
# comprometa podría callar las alertas —y al hacerlo se manda un aviso por los
# canales que aún estaban activos— pero no puede desviarlas a su propio buzón.
#
# Qué se avisa y por qué canal se elige desde Configuración, en el panel.
notificaciones:
  correo:
    servidor: ""
    # 587 con STARTTLS (tls: true) o 465 con SSL directo.
    puerto: 587
    # Vacío = no se autentica. Hay relés de red local que no lo piden.
    usuario: ""
    password: ""
    desde: ""
    destinatarios: []
    tls: true
  discord:
    # La URL del webhook ES la credencial: quien la tenga escribe en ese canal.
    # Trátala como una contraseña.
    webhook: ""

seguridad:
  helper: "/usr/local/sbin/ovpn-web-helper"
  usar_sudo: true
  db_path: "/var/lib/ovpn-web/ovpn-web.db"
  # Dónde van las copias de la base. Vacío = junto a ella, en
  # /var/lib/ovpn-web/respaldos. Se configura aquí y no desde el panel porque
  # este archivo es root:ovpnweb 0640: el panel lo lee y no lo escribe, así que
  # quien lo comprometa no puede mandar copias enteras de la base a una ruta
  # suya. Si lo cambias, la nueva ruta tiene que estar en el ReadWritePaths de
  # la unidad de systemd; fuera de ahí ProtectSystem=strict no deja escribir.
  respaldos_dir: ""
  duracion_sesion_min: 60
  max_intentos_login: 5
  bloqueo_login_min: 15
  # Solo desactívalo si sirves el panel por HTTP plano (no recomendado):
  # con true la cookie de sesión no viaja fuera de HTTPS.
  cookie_segura: true
